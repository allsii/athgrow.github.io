---
layout: default
---
<main class="content-wrap wrap">
  <a class="back-link" href="{{ '/' | relative_url }}">← 모든 글 보기</a>
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%Y년 %m월 %d일" }}{% if page.categories.size > 0 %} · {{ page.categories | join: " / " }}{% endif %}</p>
    <h1 class="content-title">{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
  </header>
  <article class="prose">{{ content }}</article>
  <div class="post-end">✳ &nbsp; THANKS FOR READING</div>
</main>
