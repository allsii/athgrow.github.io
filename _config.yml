title: "athgrow."
description: "기록하고, 만들고, 성장하는 공간."
url: "https://allsii.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - about.md

author:
  name: "athgrow"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: athgrow
